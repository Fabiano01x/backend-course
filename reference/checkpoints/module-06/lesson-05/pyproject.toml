[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "library-api-course"
version = "0.20.0"
description = "Checkpoint M06/A05 da Library API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19.1,<2.0",
  "fastapi>=0.116,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.14,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "asyncpg>=0.31,<1.0",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requer PostgreSQL externo configurado para testes"]
