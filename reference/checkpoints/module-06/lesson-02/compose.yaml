services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${LIBRARY_DATABASE_NAME:-library}
      POSTGRES_USER: ${LIBRARY_DATABASE_USER:-library}
      POSTGRES_PASSWORD: ${LIBRARY_DATABASE_PASSWORD:-local-library-password}
    ports:
      - "${LIBRARY_DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - library-postgres-data:/var/lib/postgresql

volumes:
  library-postgres-data:
